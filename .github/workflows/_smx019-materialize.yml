name: SMX-019 materialize browser slice

on:
  push:
    branches: [smx-019-browser-vertical-slice]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: smx-019-browser-vertical-slice
      - name: Materialize reviewed payload
        shell: bash
        run: |
          set -euo pipefail
          cat tools/_smx019_payload.* > /tmp/smx019.tar.gz
          echo 'f5d2760c2621277cfdef33c3ee02018b1f7f22a3d1084425a4f895554f744b58  /tmp/smx019.tar.gz' | sha256sum -c -
          tar -xzf /tmp/smx019.tar.gz -C .
          sed -i 's/[[:space:]]\+$//' docs/research/SMX-019-BROWSER-VERTICAL-SLICE.md
          # The built-in Actions token has contents:write but not workflows:write.
          # Restore tracked workflows and remove newly extracted workflow files;
          # the authenticated repository connection applies them separately.
          git restore --source=HEAD -- .github/workflows
          rm -f .github/workflows/smx019-browser-slice.yml
          rm -f tools/_smx019_payload.*
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'SMX-019 materialize browser vertical slice'
          git push origin HEAD:smx-019-browser-vertical-slice
