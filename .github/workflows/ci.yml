name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate repository structure and local Markdown links
        run: python tools/validate_repo.py
      - name: Run SMX-002 kernel falsification tests
        run: python -m unittest discover -s experiments/smx-002-kernel-model -p 'test_*.py'
      - name: Run SMX-003 composition falsification tests
        run: python -m unittest discover -s experiments/smx-003-composition-model -p 'test_*.py'
      - name: Validate SMX-004 research fixtures
        run: python tools/validate_smx004.py
      - name: Run SMX-004 behaviour execution falsification tests
        run: python -m unittest discover -s experiments/smx-004-behaviour-model -p 'test_*.py'
      - name: Validate SMX-005 research fixtures
        run: python tools/validate_smx005.py
      - name: Run SMX-005 canonical document falsification tests
        run: python -m unittest discover -s experiments/smx-005-document-model -p 'test_*.py'
      - name: Validate SMX-006 research fixtures
        run: python tools/validate_smx006.py
      - name: Run SMX-006 capability sandbox falsification tests
        run: python -m unittest discover -s experiments/smx-006-security-model -p 'test_*.py'
      - name: Validate SMX-007 research fixtures
        run: python tools/validate_smx007.py
      - name: Run SMX-007 lifecycle restore falsification tests
        run: python -m unittest discover -s experiments/smx-007-lifecycle-model -p 'test_*.py'
      - name: Validate SMX-008 research fixtures
        run: python tools/validate_smx008.py
      - name: Run SMX-008 streaming migration falsification tests
        run: python -m unittest discover -s experiments/smx-008-streaming-model -p 'test_*.py'
      - name: Validate SMX-009 research fixtures
        run: python tools/validate_smx009.py
      - name: Run SMX-009 Godot boundary falsification tests
        run: python -m unittest discover -s experiments/smx-009-godot-boundary-model -p 'test_*.py'
      - name: Validate SMX-010 research fixtures
        run: python tools/validate_smx010.py
      - name: Run SMX-010 runtime multiplayer falsification tests
        run: python -m unittest discover -s experiments/smx-010-multiplayer-model -p 'test_*.py'
      - name: Validate SMX-011 research fixtures
        run: python tools/validate_smx011.py
      - name: Run SMX-011 collaboration falsification tests
        run: python -m unittest discover -s experiments/smx-011-collaboration-model -p 'test_*.py'
      - name: Validate SMX-012 research fixtures
        run: python tools/validate_smx012.py
      - name: Run SMX-012 authoring projection falsification tests
        run: python -m unittest discover -s experiments/smx-012-authoring-model -p 'test_*.py'
      - name: Validate SMX-013 research fixtures
        run: python tools/validate_smx013.py
      - name: Run SMX-013 package/component falsification tests
        run: python -m unittest discover -s experiments/smx-013-package-model -p 'test_*.py'
      - name: Validate SMX-014 research fixtures
        run: python tools/validate_smx014.py
      - name: Run SMX-014 publishing/runtime falsification tests
        run: python -m unittest discover -s experiments/smx-014-publishing-model -p 'test_*.py'
      - name: Validate SMX-015 research fixtures
        run: python tools/validate_smx015.py
      - name: Run SMX-015 Object Fabric falsification tests
        run: python -m unittest discover -s experiments/smx-015-object-fabric-harness -p 'test_*.py'
      - name: Validate SMX-016 adversarial security fixtures
        run: python tools/validate_smx016.py
      - name: Run SMX-016 adversarial security falsification tests
        run: python -m unittest discover -s experiments/smx-016-security-harness -p 'test_*.py'
      - name: Validate SMX-017 network topology fixtures
        run: python tools/validate_smx017.py
      - name: Run SMX-017 topology semantic boundary tests
        run: python -m unittest discover -s experiments/smx-017-network-harness -p 'test_model.py' -v
      - name: Validate SMX-018 collaboration harness fixtures
        run: python tools/validate_smx018.py
      - name: Run SMX-018 collaboration destructive tests
        run: python -m unittest discover -s experiments/smx-018-collaboration-harness -p 'test_*.py'
      - name: Measure SMX-018 research-model footprint
        run: python experiments/smx-018-collaboration-harness/measure.py
      - name: Validate SMX-020 Architecture v1 freeze
        run: python tools/validate_smx020.py
