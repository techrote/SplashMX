name: _SMX-019 one-shot document reconciliation

on:
  push:
    branches: [smx-019-browser-vertical-slice]

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, 'SMX-019 reconcile durable registers') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: smx-019-browser-vertical-slice
          fetch-depth: 0
      - run: python tools/_smx019_reconcile_branch.py
      - name: Commit reconciliation if needed
        run: |
          git checkout -- .github/workflows/ci.yml
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/02-ARCHITECTURE-HYPOTHESES.md docs/03-RAG-INDEX.md docs/05-DECISION-AND-EVIDENCE-LOG.md
          git commit -m "SMX-019 reconcile durable registers"
          git push origin HEAD:smx-019-browser-vertical-slice
