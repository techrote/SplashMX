name: SMX-044 collaboration People gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  collaboration-conformance:
    name: Production CR corpus outage compaction conflict gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate inherited and SMX-044 contracts
        run: |
          python tools/validate_smx018.py
          python tools/validate_smx019.py
          python tools/validate_smx023.py
          python tools/validate_smx025.py
          python tools/validate_smx033.py
          python tools/validate_smx043.py
          python tools/validate_smx044.py
      - name: Run production collaboration implementation regressions
        run: |
          python -m unittest tests.production.test_smx043 -v
          python -m unittest tests.production.test_smx044 -v
      - name: Run inherited CR-001 through CR-028 semantic corpus
        env:
          PYTHONPATH: experiments/smx-018-collaboration-harness
        run: python -m unittest discover -s experiments/smx-018-collaboration-harness -p 'test_*.py' -v
      - name: Retain browser runtime and authoring regressions
        run: |
          python -m unittest tests.production.test_smx032 -v
          python -m unittest tests.production.test_smx033 -v

  browser-people:
    name: Pinned Chromium People Together separation and restart recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
      - name: Install pinned browser harness dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright@1.55.0 install --with-deps chromium
      - name: Validate SMX-044 contract
        run: python tools/validate_smx044.py
      - name: Run real Chromium People workflow
        run: node tests/production/smx044_browser_harness.mjs
      - name: Print measured evidence
        if: always()
        run: |
          if [ -f artifacts/smx044-browser-results.json ]; then cat artifacts/smx044-browser-results.json; fi
      - name: Upload measured browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smx044-browser-people-evidence
          path: artifacts/smx044-browser-results.json
          if-no-files-found: warn
          retention-days: 30
