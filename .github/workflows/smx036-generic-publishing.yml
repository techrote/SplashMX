name: SMX-036 generic publishing

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  generic-publishing:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate inherited and publication contracts
        run: |
          python tools/validate_smx014.py
          python tools/validate_smx019.py
          python tools/validate_smx024.py
          python tools/validate_smx027.py
          python tools/validate_smx029.py
          python tools/validate_smx030.py
          python tools/validate_smx033.py
          python tools/validate_smx035.py
          python tools/validate_smx036.py
      - name: Run production publication regressions
        env:
          PYTHONPATH: src
        run: |
          python -m unittest tests.production.test_smx024 -v
          python -m unittest tests.production.test_smx027 -v
          python -m unittest tests.production.test_smx029 -v
          python -m unittest tests.production.test_smx030 -v
          python -m unittest tests.production.test_smx033 -v
          python -m unittest tests.production.test_smx035 -v
          python -m unittest tests.production.test_smx035_adversarial -v
          python -m unittest tests.production.test_smx036 -v
          python -m unittest tests.production.test_smx036_adversarial -v

  generic-browser-player:
    name: Real Chromium immutable creation prepare-before-activate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
      - name: Install pinned browser harness dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright@1.55.0 install --with-deps chromium
      - name: Validate SMX-036 contract
        run: python tools/validate_smx036.py
      - name: Run real Chromium generic-player gate
        run: node tests/production/smx036_browser_harness.mjs
