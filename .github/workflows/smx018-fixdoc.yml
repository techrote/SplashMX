name: SMX018 one-shot residual handoff fix

on:
  push:
    branches: [smx-018-collaboration-harness]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: smx-018-collaboration-harness
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Reconcile residual handoff wording
        run: python tools/fix_smx018_doc.py
      - name: Commit fix and remove one-shot helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/research/SMX-018-COLLABORATION-HARNESS.md
          git rm .github/workflows/smx018-fixdoc.yml tools/fix_smx018_doc.py
          git commit -m 'SMX-018: reconcile residual handoff wording'
          git push origin HEAD:smx-018-collaboration-harness
