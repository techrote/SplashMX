name: SMX-023 canonical core

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  canonical-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Validate SMX-023 production contract
        run: python tools/validate_smx023.py
      - name: Run SMX-023 canonical-core adversarial tests
        run: python -m unittest discover -s tests/production -p 'test_smx023.py' -v
