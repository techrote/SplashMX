name: SMX-043 production collaboration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  production-collaboration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate inherited architecture, collaboration and persistence contracts
        run: |
          python tools/validate_smx011.py
          python tools/validate_smx018.py
          python tools/validate_smx021.py
          python tools/validate_smx022.py
          python tools/validate_smx023.py
          python tools/validate_smx024.py
          python tools/validate_smx025.py
          python tools/validate_smx041.py
          python tools/validate_smx042.py
          python tools/validate_smx043.py
      - name: Run inherited production canonical and persistence regressions
        env:
          PYTHONPATH: src
        run: |
          python -m unittest tests.production.test_smx023 -v
          python -m unittest tests.production.test_smx024 -v
          python -m unittest tests.production.test_smx025 -v
      - name: Run SMX-043 production adversarial collaboration suite
        env:
          PYTHONPATH: src
        run: python -m unittest tests.production.test_smx043 -v
      - name: Run inherited SMX-018 collaboration semantic corpus
        env:
          PYTHONPATH: experiments/smx-018-collaboration-harness
        run: python -m unittest discover -s experiments/smx-018-collaboration-harness -p 'test_*.py' -v
      - name: Run selected SMX-042 substrate regression corpus
        env:
          PYTHONPATH: experiments/smx-042-collaboration-substrate-spike
        run: python -m unittest discover -s experiments/smx-042-collaboration-substrate-spike -p 'test_*.py' -v
